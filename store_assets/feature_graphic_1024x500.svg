<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="faccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#fbg)"/>

  <!-- Left Hero Text -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="85" y="19" font-family="monospace, sans-serif" font-size="12" font-weight="bold" fill="#00F0FF" text-anchor="middle">SUNRISE 2027 READY</text>
    
    <text x="0" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="1">DUALMARK</text>
    <text x="0" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#faccent)" letter-spacing="1">STUDIO PRO</text>

    <text x="0" y="180" font-family="sans-serif" font-size="18" font-weight="600" fill="#94A3B8">
      Industrial Packaging Die-Line &amp; Barcode Compliance Workstation
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 220)">
      <circle cx="8" cy="8" r="5" fill="#00F0FF"/>
      <text x="24" y="13" font-family="sans-serif" font-size="15" fill="#E2E8F0">1D / 2D Dual Barcode Synthesis &amp; GS1 Digital Link v1.2</text>

      <circle cx="8" cy="38" r="5" fill="#10B981"/>
      <text x="24" y="43" font-family="sans-serif" font-size="15" fill="#E2E8F0">50mm Physical Optical Clearance Real-Time Inspector</text>

      <circle cx="8" cy="68" r="5" fill="#A855F7"/>
      <text x="24" y="73" font-family="sans-serif" font-size="15" fill="#E2E8F0">FDA FSMA 204 Chain-of-Custody Cryptographic Audit Vault</text>

      <circle cx="8" cy="98" r="5" fill="#F59E0B"/>
      <text x="24" y="103" font-family="sans-serif" font-size="15" fill="#E2E8F0">PostScript CMYK EPS &amp; 1200 DPI Vector PDF Prepress Plates</text>
    </g>
  </g>

  <!-- Right Graphic Illustration -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="340" height="300" rx="20" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="2"/>

    <!-- Mini 1D Barcode -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="6" height="120" fill="#00F0FF"/>
      <rect x="12" y="0" width="12" height="120" fill="#00F0FF"/>
      <rect x="30" y="0" width="6" height="120" fill="#00F0FF"/>
      <rect x="42" y="0" width="16" height="120" fill="#00F0FF"/>
      <rect x="64" y="0" width="8" height="120" fill="#00F0FF"/>
      <rect x="78" y="0" width="14" height="120" fill="#00F0FF"/>
      <rect x="98" y="0" width="6" height="120" fill="#00F0FF"/>
      <text x="52" y="145" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">UPC-A (01)</text>
    </g>

    <!-- 50mm Laser Clearance Divider -->
    <g transform="translate(150, 60)">
      <line x1="0" y1="10" x2="0" y2="120" stroke="#EF4444" stroke-width="3" stroke-dasharray="6,4"/>
      <rect x="-24" y="55" width="48" height="20" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="0" y="69" font-family="monospace" font-size="10" font-weight="bold" fill="#EF4444" text-anchor="middle">≥50mm</text>
    </g>

    <!-- Mini 2D QR Code -->
    <g transform="translate(180, 60)">
      <rect x="0" y="0" width="40" height="40" fill="none" stroke="#10B981" stroke-width="8"/>
      <rect x="12" y="12" width="16" height="16" fill="#10B981"/>
      <rect x="70" y="0" width="40" height="40" fill="none" stroke="#10B981" stroke-width="8"/>
      <rect x="82" y="12" width="16" height="16" fill="#10B981"/>
      <rect x="0" y="70" width="40" height="40" fill="none" stroke="#10B981" stroke-width="8"/>
      <rect x="12" y="82" width="16" height="16" fill="#10B981"/>
      <rect x="50" y="50" width="14" height="14" fill="#10B981"/>
      <rect x="80" y="50" width="14" height="14" fill="#10B981"/>
      <rect x="50" y="80" width="14" height="14" fill="#10B981"/>
      <rect x="80" y="80" width="14" height="14" fill="#10B981"/>
      <text x="55" y="145" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">GS1 2D LINK</text>
    </g>

    <!-- Verification Badge -->
    <rect x="25" y="240" width="290" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
    <text x="170" y="262" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">✓ OPTICAL DIE-LINE PASS: 52.4 MM</text>
  </g>
</svg>
